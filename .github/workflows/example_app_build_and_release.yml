# Build and release example app
name: example_app_build_and_release
on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  setup:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'exampleAppRelease:pending')
    uses: ./.github/workflows/setup_flutter_toolchain.yml

  release-android-example-app:
    needs: [ setup ]
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.setup.outputs.ceiling }}
          cache: true

      - uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      - name: Make secret env file accessible for envied generation.
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: ".env"
          fileDir: "./example"
          encodedString: ${{ secrets.EXAMPLE_APP_ENV_FILE_PROD_BASE64 }}

      - name: Write Keystore from base64 encoded secret.
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: "sbb_maps_flutter_example_keystore.jks"
          fileDir: "./example/android/app/keys"
          encodedString: ${{ secrets.ANDROID_KEYSTORE_64 }}

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter build appbundle --no-pub

      - name: Create Signing Report
        run: ./gradlew signingReport
        working-directory: ./example/android

      - name: Write Google SA json from base64 encoded secret
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: "google_playstore_service_account.json"
          fileDir: "./example/android/app/keys"
          encodedString: ${{ secrets.GOOGLE_PLAYSTORE_SERVICE_ACCOUNT_BASE64 }}

      - name: Release using Google Play Publisher
        run: ./gradlew publishBundle --artifact-dir ../build/app/outputs/bundle/release/
        working-directory: ./example/android

  release-ios-example-app:
    needs: [ setup ]
    runs-on: macos-26
    defaults:
      run:
        working-directory: example
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ~26.6

      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.setup.outputs.ceiling }}
          cache: true

      - name: Make secret env file accessible for envied generation.
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: ".env"
          fileDir: "./example"
          encodedString: ${{ secrets.EXAMPLE_APP_ENV_FILE_PROD_BASE64 }}

      - run: flutter pub get
      - run: dart run build_runner build

      - name: Setup iOS signing
        id: signing
        uses: ./.github/actions/setup-ios-signing
        with:
          certificate-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          appstore-connect-key-id: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          appstore-connect-issuer-id: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          appstore-connect-private-key: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}

      - run: flutter build ipa --no-pub --export-options-plist=ios/ExportOptions.plist

      - name: 'App Store Connect API: write API key file'
        env:
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_PRIVATE_KEY }}
        run: |
          # altool reads the API key from this directory by its key id.
          PRIVATE_KEYS_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$PRIVATE_KEYS_DIR"
          printf '%s\n' "$APPSTORE_CONNECT_PRIVATE_KEY" > "$PRIVATE_KEYS_DIR/AuthKey_$APPSTORE_CONNECT_KEY_ID.p8"

      - name: 'App Store Connect API: upload ipa to TestFlight'
        env:
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type ios -f build/ios/ipa/*.ipa \
            --apiKey "$APPSTORE_CONNECT_KEY_ID" --apiIssuer "$APPSTORE_CONNECT_ISSUER_ID"

      - name: 'App Store Connect API: delete API key file'
        if: always()
        run: rm -rf "$HOME/.appstoreconnect/private_keys"

      - name: Delete signing keychain
        if: always() && steps.signing.outputs.keychain-path != ''
        run: security delete-keychain "$KEYCHAIN_PATH"
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain-path }}

  label-cleanup:
    needs: [ release-android-example-app, release-ios-example-app ]
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - run: gh pr edit "$PR_NUMBER" --remove-label exampleAppRelease:pending
      - run: gh pr edit "$PR_NUMBER" --add-label exampleAppRelease:released
