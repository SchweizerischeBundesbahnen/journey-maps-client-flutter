name: example_app_build

on:
  workflow_call:
    inputs:
      flutter_sdks:
        description: 'A JSON formatted list of strings of the Flutter SDKs used to build the example app, e.g. [ "3.29.x", "3.31.x" ].'
        type: string
        required: true
    secrets:
      example_app_env_file_base64:
        required: true
      android_keystore_base64:
        required: true
      signing_keystore_password:
        required: true
      signing_key_password:
        required: true
      signing_key_alias:
        required: true

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    strategy:
      fail-fast: false
      matrix:
        flutter_sdk: ${{ fromJSON(inputs.flutter_sdks) }}

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter_sdk }}
          cache: true

      - uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "gradle"

      - name: Make secret env file accessible for envied generation
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: ".env"
          fileDir: "./example"
          encodedString: ${{ secrets.example_app_env_file_base64 }}

      - name: Write Keystore from base64 encoded secret
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: "sbb_maps_flutter_example_keystore.jks"
          fileDir: "./example/android/app/keys"
          encodedString: ${{ secrets.android_keystore_base64 }}

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter build appbundle --release --no-pub
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.signing_keystore_password }}
          SIGNING_KEY_PASSWORD: ${{ secrets.signing_key_password }}
          SIGNING_KEY_ALIAS: ${{ secrets.signing_key_alias }}

  build-iOS:
    name: Build iOS
    runs-on: macos-26
    defaults:
      run:
        working-directory: example
    strategy:
      fail-fast: false
      matrix:
        flutter_sdk: ${{ fromJSON(inputs.flutter_sdks) }}

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ~26.6

      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter_sdk }}
          cache: true

      - name: Make secret env file accessible for envied generation
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: ".env"
          fileDir: "./example"
          encodedString: ${{ secrets.example_app_env_file_base64 }}

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter build ios --no-codesign
