org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
PLAY_STORE_SERVICE_ACCOUNT_JSON=playstore_svc_dummy.json
# required while Flutter 3.44 is supported: it applies KGP to every Android module
# without checking for built-in Kotlin, which then fails to configure
android.builtInKotlin=false
# required until Flutter supports newDsl
# https://github.com/flutter/flutter/issues/180137
android.newDsl=false
